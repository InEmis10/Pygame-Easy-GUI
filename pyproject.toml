[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pygame-easy-gui"
version = "0.1.0"
description = "Des interfaces pygame à la manière de Roblox (Frame, TextLabel, Udim2, signaux)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pygame-ce>=2.5"]

[tool.setuptools.packages.find]
where = ["src"]
