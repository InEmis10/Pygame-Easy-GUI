[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pygame-easy-gui"
dynamic = ["version"]
description = "Des interfaces pygame à la manière de Roblox (Frame, TextButton, Udim2, layouts, tweens, signaux)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pygame-ce>=2.5"]
authors = [{ name = "earnaud" }]
keywords = ["pygame", "pygame-ce", "gui", "ui", "widgets", "roblox"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Games/Entertainment",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/InEmis10/Pygame-Easy-GUI"
Source = "https://github.com/InEmis10/Pygame-Easy-GUI"
Changelog = "https://github.com/InEmis10/Pygame-Easy-GUI/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.dynamic]
version = { attr = "pygame_easy_gui.__version__" }   # source unique : src/pygame_easy_gui/__init__.py

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pygame_easy_gui = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
