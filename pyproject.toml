[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pygame-easy-gui"
version = "0.1.0"
description = "Des interfaces pygame à la manière de Roblox (Frame, TextButton, Udim2, layouts, tweens, signaux)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pygame-ce>=2.5"]
authors = [{ name = "earnaud" }]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
